services:
  # 1. Emergency Service
  - type: web
    name: emergency-service
    env: node
    buildCommand: npm install && npx prisma generate --schema=packages/db/prisma/schema.prisma && npm run build -w services/emergency-service
    startCommand: npm run start:prod -w services/emergency-service
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 4001
      - key: NODE_VERSION
        value: 20.11.0
    plan: free

  # 2. Dispatch Service
  - type: web
    name: dispatch-service
    env: node
    buildCommand: npm install && npx prisma generate --schema=packages/db/prisma/schema.prisma && npm run build -w services/dispatch-service
    startCommand: npm run start:prod -w services/dispatch-service
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 4003
      - key: NODE_VERSION
        value: 20.11.0
    plan: free

  # 3. Records Service
  - type: web
    name: records-service
    env: node
    buildCommand: npm install && npx prisma generate --schema=packages/db/prisma/schema.prisma && npm run build -w services/records-service
    startCommand: npm run start:prod -w services/records-service
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 3003
      - key: NODE_VERSION
        value: 20.11.0
    plan: free
